<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<!-- Local files only. Inline handlers are allowed because the UI uses them; every user value is escaped before it is inserted. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Belo WMS</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="window">
  <div class="main">
    <nav class="side" id="side"></nav>
    <div class="content" id="content">
      <div class="toolbar">
        <div class="gsearch">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="gs" placeholder="ძებნა: სახელმწიფო ნომერი, VIN, არტიკული, ლოკაცია, ორდერის №, S/N…" oninput="gSearch()" onfocus="gSearch()" onblur="setTimeout(()=>{$('#gsr').hidden=true},180)" autocomplete="off">
          <div class="gsr" id="gsr" hidden></div>
        </div>
        <button class="btn primary" onclick="newSO()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>სერვის ორდერი</button>
      </div>
      <div class="page" id="page"><div class="empty">იტვირთება…</div></div>
    </div>
  </div>
  <div class="statusbar">
    <span><i class="dot"></i>ოფლაინ · ლოკალური ბაზა</span>
    <span id="sbWh"></span>
    <span id="sbBk"></span>
    <span id="sbVer" style="margin-left:auto"></span>
  </div>
</div>

<div class="mb" id="modal" hidden onmousedown="if(event.target===this)closeModal()">
  <div class="modal" id="mbox"><header><h3 id="mt"></h3><button onclick="closeModal()" aria-label="დახურვა"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="mbody" id="mbody"></div><footer id="mfoot"></footer></div>
</div>
<div class="toasts" id="toasts"></div>
<div class="pv" id="pv" hidden>
  <div class="pv-bar"><b>სერვის ორდერის ფორმა — A4 PDF</b><button class="btn primary" id="pdfBtn" onclick="savePDF()">PDF-ად შენახვა</button><button class="btn" onclick="closePrint()">დახურვა</button></div>
  <div class="sheet" id="pvSheet"></div>
</div>
<datalist id="dlp"></datalist>
<datalist id="dls"></datalist>
<datalist id="dlr"></datalist>
<datalist id="dlloc1"></datalist>
<datalist id="dlloc2"></datalist>
<script src="app.js"></script>
</body>
</html>
